<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Naim Musa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- تنسيق الشبكة --- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        /* --- تصميم كرت المشروع المطور --- */
        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: #4ECDC4;
        }

        .project-img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .project-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-img-container img {
            transform: scale(1.1);
        }

        .project-info {
            padding: 20px;
            text-align: center;
        }

        .project-info h3 {
            margin-bottom: 15px;
            color: #fff;
            font-size: 1.3rem;
        }

        .github-link {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            color: #4ECDC4;
            text-decoration: none;
            border: 2px solid #4ECDC4;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .github-link:hover {
            background: #4ECDC4;
            color: #1a1a1a;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تأخير ظهور الكروت */
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Naim Musa</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html" class="active">Portfolio</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="container">
        <div class="box">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">My Projects</h2>
            <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.2); width: 80px; margin-bottom: 30px;">
            
            <div class="portfolio-grid">

                <div class="project-card delay-1">
                    <div class="project-img-container">
                        <img src="LuxeTurkey.png" alt="LuxeTurkey Web Application">
                    </div>
                    <div class="project-info">
                        <h3>LuxeTurkey Web</h3>
                        <a href="https://github.com/NaimMusaaga/LuxeTurkey-Web.git" target="_blank" class="github-link">
                            Visit GitHub <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
                </div>

                <div class="project-card delay-2">
                    <div class="project-img-container">
                        <img src="Kitopia.png" alt="Kids Kitopia Platform">
                    </div>
                    <div class="project-info">
                        <h3>Kids Kitopia</h3>
                        <a href="https://github.com/NaimMusaaga/kids-Kitopia.git" target="_blank" class="github-link">
                            Visit GitHub <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
                </div>

                <div class="project-card delay-3">
                    <div class="project-img-container">
                        <img src="ŞİFADENT.png" alt="Shifa Clinic Management">
                    </div>
                    <div class="project-info">
                        <h3>Shifa Clinic</h3>
                        <a href="https://github.com/NaimMusaaga/shifa-clinic.git" target="_blank" class="github-link">
                            Visit GitHub <i class="fa-brands fa-github"></i>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; color: #fff; opacity: 0.7;">
        <p>&copy; 2025 | Naim Musa</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
