        /* تنسيق الخط الفاصل */
        .section-divider {
            border: 0;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 30px;
            width: 100px;
            margin-left: 0;
        }

        /* شبكة المهارات */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* تصميم الكرت الواحد */
        .skill-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* تأثير الهوفر */
        .skill-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #4ECDC4;
            box-shadow: 0 8px 15px rgba(78, 205, 196, 0.2);
        }

        /* تنسيق صور المهارات */
        .skill-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        /* تنسيق نص المهارة */
        .skill-card h3 {
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
            color: #fff;
        }
